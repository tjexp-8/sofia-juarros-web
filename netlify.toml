# Instrucciones para Netlify: cómo construir y publicar la web.
# Cada vez que subamos cambios a GitHub, Netlify sigue estos pasos solo.

[build]
  command = "npm run build"   # fabrica la web
  publish = "dist"            # la carpeta que se publica

[build.environment]
  NODE_VERSION = "24"         # la misma versión de Node que en tu ordenador

# Los archivos de /_astro/ llevan un código único en el nombre que cambia
# cada vez que los modificamos. Por eso el navegador puede guardarlos
# un año entero sin volver a pedirlos: la segunda visita es casi instantánea.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
